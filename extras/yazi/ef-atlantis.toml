[manager]
# NOTE: can combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#7f8385", italic = true }

# Hovered
hovered         = { bg = "#2b265b" }
preview_hovered = { bg = "#2b265b" }

# Find
find_keyword  = { fg = "#1a204b", bg = "#3e300c", bold = true }
find_position = { fg = "#1a204b", bg = "#2f5f9f", bold = true }

# Marker
marker_copied   = { fg = "#1fa526", bg = "#1fa526" }
marker_cut      = { fg = "#ef656a", bg = "#ef656a" }
marker_marked   = { fg = "#d590af", bg = "#d590af" }
marker_selected = { fg = "#379cf6", bg = "#379cf6" }

# Tab
tab_active   = { fg = "#bfcccf", bg = "#1a204b" }
tab_inactive = { fg = "#7f8385", bg = "#24314f" }
tab_width    = 1

# Count
count_copied   = { fg = "#bfcccf", bg = "#81a06c" }
count_cut      = { fg = "#bfcccf", bg = "#f47360" }
count_selected = { fg = "#bfcccf", bg = "#379cf6" }

# Border
border_symbol = "│"
border_style  = { fg = "#454e59" }

[mode]
normal_main = { fg = "#1a143e", bg = "#379cf6", bold = true }
normal_alt  = { fg = "#379cf6", bg = "#7f8385" }

select_main = { fg = "#1a143e", bg = "#d590af", bold = true }
select_alt  = { fg = "#d590af", bg = "#7f8385" }

unset_main  = { fg = "#1a143e", bg = "#af9ef2", bold = true }
unset_alt   = { fg = "#af9ef2", bg = "#7f8385" }

[status]
separator_open    = ""
separator_close   = ""
# separator_style = { fg = "#7f8385", bg = "#7f8385" }

# Progress
progress_label  = { fg = "#7f8385", bold = true }
progress_normal = { fg = "#1a143e" }
progress_error  = { fg = "#ef798f" }

# Permissions
perm_type  = { fg = "#379cf6" }
perm_read  = { fg = "#c48502" }
perm_write = { fg = "#ef656a" }
perm_exec  = { fg = "#1fa526" }
perm_sep   = { fg = "#1a143e" }

[pick]
border   = { fg = "#454e59" }
active   = { fg = "#bfcccf",  bg = "#2b265b" }
inactive = { fg = "#967e92" }

# Input
[input]
border   = { fg = "#7a7fff" }
title    = { fg = "#7a7fff" }
value    = { fg = "#af9ef2" }
selected = { bg = "#2b265b" }

# Completion
[completion]
border   = { fg = "#7a7fff" }
active   = { fg = "#bfcccf", bg = "#2b265b" }
inactive = { fg = "#bfcccf" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#454e59" }
title   = { fg = "#454e59" }
hovered = { fg = "#bfcccf", bg="#2b265b" }

# Which
[which]
cols            = 3
mask            = { bg = "#1a204b" }
cand            = { fg = "#4fb0cf" }
rest            = { fg = "#379cf6" }
desc            = { fg = "#d590af" }
separator       = " ➜ "
separator_style = { fg = "#7a7fff" }

# Confirm
[confirm]
border  = { fg = "#7a7fff" }
title   = { fg = "#454e59" }
content = {}
list    = {}
btn_yes = { bg = "#2b265b" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#454e59" }
title   = { fg = "#454e59" }

# Notify
[notify]
title_info  = { fg = "#00a962" }
title_warn  = { fg = "#b5967b" }
title_error = { fg = "#ef798f" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on      = { fg = "#1fa526" }
run     = { fg = "#d590af" }
hovered = { bg = "#2b265b" }
footer  = { fg = "#bfcccf", bg = "#1a143e" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#c48502" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d590af" },

	# Archives
	{ mime = "application/*zip", fg = "#ef656a" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ef656a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#4fb0cf" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#ef656a" },

	# Special files
	{ name = "*", is = "orphan", bg = "#ef656a" },
	{ name = "*", is = "exec"  , fg = "#1fa526" },

	# Fallback
	{ name = "*/", fg = "#379cf6" }
]
    